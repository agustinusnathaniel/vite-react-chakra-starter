<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="noindex" name="robots">
    <title>Page not Found</title>
    <style>
    :root {
      font-family:
        system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1a202c;
      color-scheme: light;
      background: #fff;
    }
    body {
      margin: 0;
    }
    main {
      box-sizing: border-box;
      display: grid;
      gap: 1rem;
      place-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }
    img {
      display: block;
      max-width: min(400px, 80vw);
      height: auto;
      margin: 0 auto;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 4vw, 2.5rem);
    }
    p {
      margin: 0;
    }
    a {
      font-weight: 600;
      color: #5b21b6;
    }
    .credit {
      font-size: 0.75rem;
      font-weight: 400;
    }
    </style>
  </head>
  <body>
    <main>
      <div>
        <img alt="" height="400" src="/assets/404 Error-rafiki.svg" width="400">
        <a
          class="credit"
          href="https://stories.freepik.com/web"
          rel="noopener noreferrer"
          >Illustration by Freepik Stories</a
        >
      </div>
      <h1>Page not Found</h1>
      <p>It's Okay!</p>
      <a href="/">Let's Head Back</a>
    </main>
  </body>
</html>
